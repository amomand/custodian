name: Playtest implementer catch-up

# The implementer is normally woken through a deterministic workflow_run
# gateway after the weekly playtest review. That handoff is not retried, so an
# implementer run that dies takes its findings down with it: the issues stay
# open with nothing watching them. This sweep is the safety net. It is
# deterministic Actions code with no model, and its only power is to
# re-dispatch the implementer against a verified provenance run ID.

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: read
  issues: write

concurrency:
  group: playtest-implementer-catchup
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          script: |
            const catchup = require("./tools/playtest_catchup_state.cjs");
            const { owner, repo } = context.repo;
            const repository = `${owner}/${repo}`;
            const defaultBranch = context.payload.repository.default_branch;
            const now = Date.now();
            const IMPLEMENTER = "playtest-fix-implementer.lock.yml";

            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner,
              repo,
              state: "open",
              labels: catchup.LABEL,
              per_page: 100,
            });
            const pulls = await github.paginate(github.rest.pulls.list, {
              owner,
              repo,
              state: "open",
              per_page: 100,
            });

            const plan = catchup.planCatchup({ issues, pulls, repository, now });
            if (!plan.length) {
              core.info("No playtest issues are waiting on the implementer.");
              return;
            }
            core.info(
              `Unpicked provenance runs: ${plan.map((g) => `${g.runId} (#${g.issues.join(", #")})`).join("; ")}`,
            );

            // Every open issue the run filed carries the ledger, not just the
            // uncovered ones, so the attempt count survives one of them being
            // closed by a merged fix.
            const issuesByRun = new Map();
            for (const issue of issues) {
              if (issue.pull_request) continue;
              const runId = catchup.provenanceRunId(issue);
              if (!runId) continue;
              if (!issuesByRun.has(runId)) issuesByRun.set(runId, []);
              issuesByRun.get(runId).push(issue.number);
            }

            async function commentsForRun(runId) {
              const all = [];
              for (const number of issuesByRun.get(runId) || []) {
                const comments = await github.paginate(github.rest.issues.listComments, {
                  owner,
                  repo,
                  issue_number: number,
                  per_page: 100,
                });
                all.push(...comments);
              }
              return all;
            }

            // A label failure must never mask the marker comment, which is the
            // authoritative state.
            async function announce(numbers, body, label) {
              for (const number of numbers) {
                await github.rest.issues.createComment({
                  owner,
                  repo,
                  issue_number: number,
                  body,
                });
                if (!label) continue;
                try {
                  await github.rest.issues.addLabels({
                    owner,
                    repo,
                    issue_number: number,
                    labels: [label],
                  });
                } catch (error) {
                  core.warning(
                    `Could not label #${number}: ${error?.message ?? String(error)}`,
                  );
                }
              }
            }

            async function clearNeedsHuman(numbers) {
              for (const number of numbers) {
                try {
                  await github.rest.issues.removeLabel({
                    owner,
                    repo,
                    issue_number: number,
                    name: "needs-human",
                  });
                } catch (error) {
                  if (error?.status !== 404) {
                    core.warning(
                      `Could not clear needs-human from #${number}: ${error?.message ?? String(error)}`,
                    );
                  }
                }
              }
            }

            let dispatched = null;
            for (const group of plan) {
              if (dispatched) break;
              const { runId } = group;
              const state = catchup.catchupState(await commentsForRun(runId), runId, now);
              if (state.escalated) continue;

              let reviewRun = null;
              try {
                const response = await github.rest.actions.getWorkflowRun({
                  owner,
                  repo,
                  run_id: Number(runId),
                });
                reviewRun = response.data;
              } catch (error) {
                if (error?.status !== 404) throw error;
              }

              let defaultContainsHead = false;
              if (
                reviewRun?.head_branch !== defaultBranch &&
                typeof reviewRun?.head_sha === "string" &&
                reviewRun.head_sha
              ) {
                try {
                  const comparison = await github.rest.repos.compareCommitsWithBasehead({
                    owner,
                    repo,
                    basehead: `${reviewRun.head_sha}...${defaultBranch}`,
                  });
                  defaultContainsHead = catchup.defaultBranchContainsReview(
                    comparison.data,
                  );
                } catch (error) {
                  if (error?.status !== 404) throw error;
                }
              }

              const verdict = catchup.reviewRunVerdict(
                reviewRun,
                defaultBranch,
                defaultContainsHead,
              );
              if (verdict === "off-main") {
                // Deliberately not dispatched while the review head remains
                // branch-only. It used that branch's own reviewer instructions,
                // and auto-dispatching here would hand unmerged workflow code
                // main's authority. Say so once, then re-check on later sweeps
                // in case the exact commit lands in the default branch.
                if (!state.offMain) {
                  await announce(
                    group.issues,
                    `${catchup.offMainMarker(runId)}\nPlaytest review run \`${runId}\` finished on \`${reviewRun.head_branch}\`, not \`${defaultBranch}\`, and its head commit is not contained in \`${defaultBranch}\`, so the implementer trigger never fired and this sweep will not fire it either. If that exact head later lands in \`${defaultBranch}\`, the sweep can safely retry; otherwise dispatch **Implement playtest findings** manually with \`playtest_run_id: ${runId}\`, or close this issue.`,
                    "needs-human",
                  );
                }
                continue;
              }
              if (verdict !== "eligible") {
                core.warning(
                  `Skipping provenance run ${runId}: ${verdict}. Issues #${(group.issues || []).join(", #")} are not eligible for an automatic catch-up.`,
                );
                continue;
              }

              if (state.exhausted) {
                await announce(
                  group.issues,
                  `${catchup.exhaustedMarker(runId)}\nThe catch-up sweep has re-dispatched **Implement playtest findings** for playtest run \`${runId}\` ${state.attempts} times and this issue is still unpicked. It is stopping rather than retrying silently. Either the findings no longer reproduce and this can be closed, or the implementer needs looking at.`,
                  "needs-human",
                );
                continue;
              }
              if (!state.dispatchable) {
                core.info(`Provenance run ${runId} is still inside its retry cooldown.`);
                continue;
              }

              const recentImplementerRuns = await github.rest.actions.listWorkflowRuns({
                owner,
                repo,
                workflow_id: IMPLEMENTER,
                per_page: 20,
              });
              if (catchup.isImplementerBusy(recentImplementerRuns.data.workflow_runs)) {
                core.info("An implementer run is already going; leaving the sweep for later.");
                break;
              }

              // Record the attempt before making it, so a dispatch that fails
              // is visible on the issue rather than being lost.
              const marker = catchup.dispatchMarker(runId, state.nextAttempt);
              const body = `${marker}\nThe implementer never picked up playtest run \`${runId}\`, so the catch-up sweep is dispatching **Implement playtest findings** for it (attempt ${state.nextAttempt} of ${catchup.ATTEMPT_LIMIT}), scoped to #${group.issues.join(", #")}. Provenance is unchanged: the implementer re-verifies this run's marker on every issue it selects.`;
              // The ledger goes on every open issue the run filed, so the
              // attempt count survives one of them being closed by a merged fix.
              await announce(issuesByRun.get(runId) || group.issues, body);

              try {
                await github.rest.actions.createWorkflowDispatch({
                  owner,
                  repo,
                  workflow_id: IMPLEMENTER,
                  ref: defaultBranch,
                  inputs: {
                    playtest_run_id: String(runId),
                    issue_numbers: group.issues.join(","),
                  },
                });
                await clearNeedsHuman(group.issues);
              } catch (error) {
                await announce(
                  group.issues,
                  `${catchup.exhaustedMarker(runId)}\nThe catch-up sweep could not dispatch **Implement playtest findings** for playtest run \`${runId}\`: ${error?.message ?? String(error)}`,
                  "needs-human",
                );
                throw error;
              }
              dispatched = { runId, issues: group.issues };
            }

            if (dispatched) {
              core.info(
                `Dispatched the implementer for playtest run ${dispatched.runId}, scoped to #${dispatched.issues.join(", #")}.`,
              );
            }
